name: Beta Build

on:
  push:
    branches:
      - dev
    tags:
      - 'beta-v*'
    paths-ignore:
      - '**.md'
      - 'docs_md/**'
      - 'docs/**'
      - 'fastlane/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Beta APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android_app/**/*.gradle*', 'android_app/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode beta keystore
        run: echo "${{ secrets.BETA_KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/openscale-plus-beta.jks

      - name: Verify beta keystore
        env:
          KEYSTORE_PASS: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
        run: keytool -list -keystore $RUNNER_TEMP/openscale-plus-beta.jks -storepass "$KEYSTORE_PASS"

      - name: Build & sign beta APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/openscale-plus-beta.jks
          KEYSTORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BETA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
        run: ./gradlew assembleBeta --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openscale-plus-beta-${{ github.run_number }}
          path: android_app/app/build/outputs/apk/beta/*.apk
          retention-days: 30

      # Rolling beta pre-release on every dev push
      - name: Create rolling beta release
        if: github.ref == 'refs/heads/dev'
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: beta-latest
          prerelease: true
          title: openScale+ Beta Latest
          files: android_app/app/build/outputs/apk/beta/*.apk

      # Versioned beta release on beta-v* tags
      - name: Create versioned beta release
        if: startsWith(github.ref, 'refs/tags/beta-v')
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: ${{ github.ref_name }}
          prerelease: true
          title: openScale+ Beta ${{ github.ref_name }}
          files: android_app/app/build/outputs/apk/beta/*.apk
